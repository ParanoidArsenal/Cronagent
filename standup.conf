# Standup Prep Agent — Configuration
# Edit this file to customize your standup collection.

# Git author email to filter commits by
AUTHOR_EMAIL=user@example.com

# Mattermost channel ID for posting (leave empty to print to stdout only)
STANDUP_CHANNEL_ID=

# Repositories to scan for git activity
# One path per line, ~ is expanded automatically
REPOS=(
  ~/projects/my-app
  ~/projects/frontend
  ~/projects/e2e-tests
  ~/projects/cypress-tests
  ~/projects/monorepo
)
